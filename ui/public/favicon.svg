<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orb-glow" cx="50%" cy="45%" r="50%" fx="45%" fy="40%">
      <stop offset="0%" stop-color="#5CFBB1"/>
      <stop offset="45%" stop-color="#14F195"/>
      <stop offset="85%" stop-color="#0BA06A"/>
      <stop offset="100%" stop-color="#065F3E"/>
    </radialGradient>
    <radialGradient id="orb-shine" cx="38%" cy="32%" r="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#14F195" stop-opacity="0"/>
    </radialGradient>
    <filter id="outer-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background glow -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-glow)"/>
  <!-- Main orb -->
  <circle cx="60" cy="60" r="42" fill="url(#orb-glow)" filter="url(#outer-glow)"/>
  <!-- Geometric ring pattern -->
  <circle cx="60" cy="60" r="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.8"/>
  <circle cx="60" cy="60" r="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="0.5"/>
  <!-- Inner geometric lines -->
  <path d="M60 28 L60 92" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="0.5"/>
  <path d="M28 60 L92 60" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="0.5"/>
  <path d="M37 37 L83 83" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.5"/>
  <path d="M83 37 L37 83" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.5"/>
  <!-- Specular highlight -->
  <ellipse cx="50" cy="46" rx="18" ry="14" fill="url(#orb-shine)"/>
  <!-- Small accent dot -->
  <circle cx="60" cy="60" r="4" fill="#FFFFFF" fill-opacity="0.2"/>
</svg>
