services:
  - type: web
    name: sage
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: SAGE_STATE_DIR
        value: /data/.sage
      - key: SAGE_WORKSPACE_DIR
        value: /data/workspace
      - key: SAGE_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: sage-data
      mountPath: /data
      sizeGB: 1
