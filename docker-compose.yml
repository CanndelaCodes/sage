services:
  sage-gateway:
    image: ${SAGE_IMAGE:-sage:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      SAGE_GATEWAY_TOKEN: ${SAGE_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${SAGE_CONFIG_DIR}:/home/node/.sage
      - ${SAGE_WORKSPACE_DIR}:/home/node/.sage/workspace
    ports:
      - "${SAGE_GATEWAY_PORT:-18789}:18789"
      - "${SAGE_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${SAGE_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  sage-cli:
    image: ${SAGE_IMAGE:-sage:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      SAGE_GATEWAY_TOKEN: ${SAGE_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${SAGE_CONFIG_DIR}:/home/node/.sage
      - ${SAGE_WORKSPACE_DIR}:/home/node/.sage/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
