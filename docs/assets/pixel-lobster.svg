<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" role="img" aria-label="Sage">
  <rect width="16" height="16" fill="none"/>
  <!-- Pixel art emerald orb -->
  <!-- Outer ring -->
  <g fill="#065F3E">
    <rect x="5" y="2" width="6" height="1"/>
    <rect x="3" y="3" width="2" height="1"/>
    <rect x="11" y="3" width="2" height="1"/>
    <rect x="2" y="5" width="1" height="6"/>
    <rect x="13" y="5" width="1" height="6"/>
    <rect x="3" y="12" width="2" height="1"/>
    <rect x="11" y="12" width="2" height="1"/>
    <rect x="5" y="13" width="6" height="1"/>
  </g>
  <!-- Outer body -->
  <g fill="#0BA06A">
    <rect x="3" y="4" width="10" height="1"/>
    <rect x="3" y="11" width="10" height="1"/>
    <rect x="2" y="4" width="1" height="1"/>
    <rect x="13" y="4" width="1" height="1"/>
    <rect x="2" y="11" width="1" height="1"/>
    <rect x="13" y="11" width="1" height="1"/>
  </g>
  <!-- Main body -->
  <g fill="#14F195">
    <rect x="3" y="5" width="10" height="6"/>
  </g>
  <!-- Highlight -->
  <g fill="#5CFBB1">
    <rect x="5" y="3" width="6" height="1"/>
    <rect x="4" y="5" width="4" height="2"/>
    <rect x="5" y="4" width="3" height="1"/>
  </g>
  <!-- Specular -->
  <g fill="#FFFFFF" fill-opacity="0.4">
    <rect x="5" y="5" width="2" height="1"/>
    <rect x="6" y="4" width="1" height="1"/>
  </g>
  <!-- Inner ring hint -->
  <g fill="#FFFFFF" fill-opacity="0.15">
    <rect x="5" y="7" width="6" height="1"/>
    <rect x="4" y="8" width="1" height="1"/>
    <rect x="11" y="8" width="1" height="1"/>
  </g>
  <!-- Center dot -->
  <rect x="7" y="7" width="2" height="2" fill="#FFFFFF" fill-opacity="0.2"/>
</svg>
